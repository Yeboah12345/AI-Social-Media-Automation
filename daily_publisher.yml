name: Daily Automated Social Media Publisher

on:
  schedule:
    - cron: '0 9 * * *' # Auto-runs daily at 9:00 AM UTC
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  publish-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js

      - name: Run Publisher Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SOCIAL_API_KEY: ${{ secrets.SOCIAL_API_KEY }}
        run: node publish_posts.js
